<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>鸣潮 旧雨杯 · 英雄联盟职业赛风格 BP 客户端</title>
<link rel="stylesheet" href="./theme-wuwa-deep.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Rajdhani:wght@600;700&family=Oswald:wght@500;600;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue-team: #00d2ff;
  --blue-team-glow: rgba(0, 210, 255, 0.65);
  --red-team: #ff3366;
  --red-team-glow: rgba(255, 51, 102, 0.65);
  --ban-red: #ff2233;
  --gold-hex: #e5b960;
  --gold-glow: rgba(229, 185, 96, 0.55);

  --bg-deep: #030712;
  --panel-glass: rgba(5, 12, 28, 0.88);
  --text-main: #f0f6fc;
  --text-muted: #7390b0;

  --font-esports: 'Rajdhani', 'Oswald', 'Noto Sans SC', sans-serif;
  --font-title: 'Oswald', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', 'Rajdhani', sans-serif;
}

html, body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #02050e;
  font-family: var(--font-body);
  color: var(--text-main);
  user-select: none;
}

#bg-main {
  position: fixed; inset: 0; z-index: 0;
  background: url('./3.jpg') center/cover no-repeat;
  filter: brightness(0.38) saturate(1.2);
}

#bg-overlay {
  position: fixed; inset: 0; z-index: 1;
  background:
    radial-gradient(ellipse 1200px 700px at 50% 30%, rgba(3, 10, 30, 0.3) 0%, rgba(2, 5, 14, 0.95) 75%),
    linear-gradient(180deg, rgba(2, 6, 18, 0.98) 0%, rgba(3, 8, 22, 0.8) 15%, rgba(3, 8, 22, 0.8) 85%, rgba(1, 3, 10, 0.98) 100%);
}

#app {
  position: relative; z-index: 10;
  width: 1920px; height: 1080px;
  display: grid;
  grid-template-rows: 92px 34px 1fr 94px;
  grid-template-columns: 290px 1fr 290px;
}

/* ════════ 顶部对决比分台 ════════ */
#header {
  grid-column: 1 / -1; grid-row: 1;
  display: grid; grid-template-columns: 460px 1fr 460px;
  align-items: center;
  background: linear-gradient(180deg, rgba(4, 9, 24, 0.98) 0%, rgba(2, 6, 18, 0.92) 100%);
  border-bottom: 1px solid rgba(56, 189, 248, 0.25);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
}

.team-header-box {
  display: flex; align-items: center; gap: 16px; padding: 0 28px; height: 100%; position: relative;
}
.team-header-box.blue {
  background: linear-gradient(90deg, rgba(0, 160, 255, 0.22) 0%, transparent 100%);
}
.team-header-box.blue::before {
  content: ''; position: absolute; left: 0; top: 12%; bottom: 12%; width: 4px;
  background: var(--blue-team); box-shadow: 0 0 16px var(--blue-team-glow);
}
.team-header-box.red {
  flex-direction: row-reverse; text-align: right;
  background: linear-gradient(270deg, rgba(255, 51, 102, 0.22) 0%, transparent 100%);
}
.team-header-box.red::before {
  content: ''; position: absolute; right: 0; top: 12%; bottom: 12%; width: 4px;
  background: var(--red-team); box-shadow: 0 0 16px var(--red-team-glow);
}

.team-logo-wrap {
  width: 64px; height: 64px; border-radius: 6px; overflow: hidden;
  border: 2px solid rgba(0, 210, 255, 0.6); box-shadow: 0 0 16px rgba(0, 210, 255, 0.35);
  background: rgba(4, 14, 36, 0.9); flex-shrink: 0;
}
.team-logo-wrap.red { border-color: rgba(255, 51, 102, 0.6); box-shadow: 0 0 16px rgba(255, 51, 102, 0.35); }
.team-logo-img { width: 100%; height: 100%; object-fit: cover; }

.team-player-name {
  font-family: var(--font-title); font-size: 22px; font-weight: 700; letter-spacing: 2px;
  color: #fff; text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
}

#center-header {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.match-title-row { display: flex; align-items: center; gap: 14px; }
.match-title-text {
  font-family: var(--font-title); font-size: 26px; font-weight: 700; letter-spacing: 8px;
  background: linear-gradient(180deg, #fff 0%, #d8e8f8 60%, #a4c2e6 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.match-stage-tag {
  font-family: var(--font-esports); font-size: 11px; font-weight: 700; letter-spacing: 4px;
  color: var(--gold-hex); padding: 2px 18px; border-radius: 2px;
  background: rgba(229, 185, 96, 0.12); border: 1px solid rgba(229, 185, 96, 0.45);
}

/* ════════ 跑马条 ════════ */
#sponsor-bar {
  grid-column: 1 / -1; grid-row: 2;
  display: flex; align-items: center; justify-content: center; gap: 32px;
  background: linear-gradient(180deg, rgba(2, 6, 18, 0.96) 0%, rgba(4, 10, 28, 0.94) 100%);
  border-bottom: 1px solid rgba(56, 189, 248, 0.12); font-size: 11px; font-weight: 700; letter-spacing: 2px;
}

/* ════════ 选角侧边栏 ════════ */
.player-column {
  grid-row: 3 / 4;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(3, 8, 22, 0.92) 0%, rgba(2, 5, 16, 0.96) 100%);
  border-right: 1px solid rgba(56, 189, 248, 0.15);
}
#p2-panel { border-right: none; border-left: 1px solid rgba(255, 51, 102, 0.15); }

.col-header {
  height: 36px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; font-family: var(--font-esports); font-size: 12px; font-weight: 700; letter-spacing: 3px;
  border-bottom: 1px solid rgba(56, 189, 248, 0.15);
}
.col-header.blue { color: var(--blue-team); background: linear-gradient(90deg, rgba(0, 160, 255, 0.25) 0%, transparent 100%); }
.col-header.red { color: var(--red-team); background: linear-gradient(270deg, rgba(255, 51, 102, 0.25) 0%, transparent 100%); flex-direction: row-reverse; }

.pick-cards-container {
  flex: 1; display: flex; flex-direction: column; gap: 3px; padding: 4px 6px;
  min-height: 0; overflow: hidden;
}

.es-pick-card {
  flex: 1; min-height: 0; border-radius: 4px; position: relative; overflow: hidden;
  background: rgba(6, 14, 32, 0.88); border: 1px solid rgba(40, 80, 140, 0.28);
  display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  transition: all 0.25s ease;
}
.es-pick-card:hover { border-color: rgba(255, 255, 255, 0.4); transform: scale(1.01); }

.es-pick-portrait-box {
  width: 116px; height: 100%; flex-shrink: 0; position: relative; overflow: hidden; display: block;
}
.es-pick-portrait-img {
  width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block;
}
#p1-pick-cards .es-pick-portrait-box::before {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg, rgba(6, 14, 32, 0.95) 0%, rgba(6, 14, 32, 0.4) 25%, transparent 60%);
}
#p2-pick-cards .es-pick-portrait-box::before {
  content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(270deg, rgba(6, 14, 32, 0.95) 0%, rgba(6, 14, 32, 0.4) 25%, transparent 60%);
}

.es-pick-meta {
  position: relative; z-index: 3; flex: 1; min-width: 0;
  display: flex; flex-direction: column; gap: 2px; padding: 0 12px;
}
#p2-pick-cards .es-pick-meta { text-align: right; }

.es-pick-slot-tag { font-family: var(--font-esports); font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--text-muted); }
.es-pick-name-zh { font-family: var(--font-title); font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #fff; }

.es-pick-card.active.blue {
  border: 1.5px solid var(--blue-team); box-shadow: 0 0 20px rgba(0, 210, 255, 0.45);
}
.es-pick-card.active.red {
  border: 1.5px solid var(--red-team); box-shadow: 0 0 20px rgba(255, 51, 102, 0.45);
}

.ban-section-tray {
  padding: 4px 6px 6px; background: rgba(3, 7, 18, 0.95); border-top: 1px solid rgba(56, 189, 248, 0.15);
}
.ban-tray-lbl { font-family: var(--font-esports); font-size: 9px; font-weight: 700; letter-spacing: 3px; color: var(--ban-red); margin-bottom: 4px; padding-left: 4px; }
.ban-cards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }

.es-ban-slot {
  height: 48px; border-radius: 3px; position: relative; overflow: hidden;
  background: rgba(8, 14, 28, 0.9); border: 1px solid rgba(255, 40, 40, 0.25); cursor: pointer;
}
.es-ban-slot.empty {
  border-style: dashed; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-esports); font-size: 9px; color: rgba(255, 60, 60, 0.3);
}
.es-ban-artwork {
  width: 100%; height: 100%; object-fit: cover; object-position: center 20%;
  filter: grayscale(0.7) brightness(0.65);
}
.es-ban-slash {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 46%, rgba(255, 40, 40, 0.95) 49%, #fff 50%, rgba(255, 40, 40, 0.95) 51%, transparent 54%);
}
.es-ban-badge-x {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; color: rgba(255, 60, 60, 0.9);
}

/* ════════ 中央舞台 ════════ */
#center {
  grid-column: 2 / 3; grid-row: 3 / 4; display: flex; flex-direction: column; position: relative;
}
#bp-seq-bar {
  height: 28px; background: rgba(3, 8, 20, 0.85); border-bottom: 1px solid rgba(56, 189, 248, 0.15);
  display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 12px;
}
.seq-node {
  height: 10px; flex: 1; max-width: 44px; border-radius: 2px;
  background: rgba(20, 36, 64, 0.5); border: 1px solid rgba(60, 110, 180, 0.3);
}
.seq-node.done.ban { background: rgba(180, 20, 20, 0.6); border-color: rgba(255, 50, 50, 0.6); }
.seq-node.done.pick.p1 { background: rgba(0, 140, 255, 0.6); border-color: rgba(0, 210, 255, 0.6); }
.seq-node.done.pick.p2 { background: rgba(255, 40, 80, 0.6); border-color: rgba(255, 51, 102, 0.6); }
.seq-node.cur { height: 14px; transform: scaleY(1.2); box-shadow: 0 0 14px #fff; }

#video-area { flex: 1; position: relative; }

/* ════════ 底部栏 ════════ */
#bottom {
  grid-column: 1 / -1; grid-row: 4;
  display: grid; grid-template-columns: 460px 1fr 460px; align-items: center;
  background: linear-gradient(180deg, rgba(3, 8, 22, 0.95) 0%, rgba(1, 4, 12, 0.98) 100%);
  border-top: 1px solid rgba(56, 189, 248, 0.22); padding: 0 24px; position: relative; z-index: 10;
}
.bt-score-digits {
  font-family: 'Oswald', var(--font-esports); font-size: 38px; font-weight: 700; letter-spacing: 6px;
  display: flex; align-items: center; justify-content: center; gap: 12px;
}

/* ════════ 选角弹窗 (Hero Picker Modal) ════════ */
#char-modal {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(1, 4, 12, 0.88); backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center;
}
#char-modal.show { display: flex; }

.modal-dialog {
  width: 1200px; max-height: 860px; border-radius: 8px; overflow: hidden;
  background: #040916; border: 1.5px solid var(--blue-team);
  box-shadow: 0 20px 80px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 210, 255, 0.3);
  display: flex; flex-direction: column;
}

.modal-header {
  padding: 16px 24px; background: rgba(8, 18, 40, 0.95);
  border-bottom: 1px solid rgba(56, 189, 248, 0.2);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-family: var(--font-title); font-size: 20px; font-weight: 700; letter-spacing: 3px; color: #fff; }

.filter-bar {
  padding: 12px 24px; background: rgba(5, 12, 28, 0.95);
  border-bottom: 1px solid rgba(56, 189, 248, 0.15);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.filter-btn {
  font-family: var(--font-esports); font-size: 11px; font-weight: 700; letter-spacing: 2px;
  padding: 4px 14px; border-radius: 3px; cursor: pointer;
  background: rgba(14, 28, 56, 0.6); color: var(--text-muted); border: 1px solid rgba(56, 189, 248, 0.25);
  transition: all 0.2s;
}
.filter-btn.active, .filter-btn:hover { background: var(--blue-team); color: #000; border-color: var(--blue-team); }

.search-input {
  background: rgba(8, 18, 36, 0.9); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 4px;
  padding: 6px 14px; color: #fff; font-size: 12px; outline: none; margin-left: auto; width: 220px;
}

.char-grid-scroll {
  flex: 1; padding: 18px 24px; overflow-y: auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px;
  max-height: 580px;
}

.grid-card {
  height: 140px; border-radius: 4px; position: relative; overflow: hidden;
  background: rgba(8, 18, 40, 0.85); border: 1px solid rgba(56, 189, 248, 0.2);
  cursor: pointer; transition: all 0.2s ease;
}
.grid-card:hover { border-color: var(--blue-team); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 210, 255, 0.3); }
.grid-card.disabled { filter: grayscale(1); opacity: 0.25; cursor: not-allowed; pointer-events: none; }

.grid-card img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; }
.grid-card-name {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 4px 6px; background: linear-gradient(0deg, rgba(2, 6, 18, 0.98), transparent);
  font-size: 11px; font-weight: 700; text-align: center; color: #fff;
}

</style>
<script src="./characters-data.js"></script>
<script src="./mqtt.min.js"></script>
<script src="./sync-config.js"></script>
</head>
<body>

<div id="bg-main"></div>
<div id="bg-overlay"></div>

<div id="app">

  <!-- 顶部对决比分台 -->
  <div id="header">
    <div class="team-header-box blue">
      <div class="team-logo-wrap blue"><img class="team-logo-img" src="./guide.png" onerror="this.src='./logo-crop.jpg'" alt=""></div>
      <div>
        <div style="font-family:var(--font-esports);font-size:11px;font-weight:700;color:var(--blue-team);">BLUE SIDE</div>
        <div class="team-player-name" id="hdr-p1-name">玩家一</div>
      </div>
    </div>
    <div id="center-header">
      <div class="match-title-row"><div class="match-title-text">旧 雨 杯</div></div>
      <div class="match-stage-tag" id="phase-tag">BP 客户端</div>
    </div>
    <div class="team-header-box red">
      <div class="team-logo-wrap red"><img class="team-logo-img" src="./guide.png" onerror="this.src='./logo-crop.jpg'" alt=""></div>
      <div>
        <div style="font-family:var(--font-esports);font-size:11px;font-weight:700;color:var(--red-team);">RED SIDE</div>
        <div class="team-player-name" id="hdr-p2-name">玩家二</div>
      </div>
    </div>
  </div>

  <!-- 跑马条 -->
  <div id="sponsor-bar">
    <span style="color:#00d2ff;">螃蟹账号</span> <span>·</span>
    <span style="color:#38bdf8;">蓝桉互娱</span> <span>·</span>
    <span style="color:var(--gold-hex);">旧雨杯鸣潮娱乐赛</span> <span>·</span>
    <span style="color:#ff3366;">赵礼杰天下第一</span> <span>·</span>
    <span style="color:#20c8a0;">Rainly 雨屿</span>
  </div>

  <!-- 蓝方栏 -->
  <div class="player-column" id="p1-panel">
    <div class="col-header blue"><span>BLUE PICKS</span><span id="p1-panel-name">玩家一</span></div>
    <div class="pick-cards-container" id="p1-pick-cards"></div>
    <div class="ban-section-tray">
      <div class="ban-tray-lbl">BLUE BANS</div>
      <div class="ban-cards-grid" id="p1-ban-cards"></div>
    </div>
  </div>

  <!-- 中央舞台 -->
  <div id="center">
    <div id="bp-seq-bar"></div>
    <div id="video-area"></div>
  </div>

  <!-- 红方栏 -->
  <div class="player-column" id="p2-panel">
    <div class="col-header red"><span>RED PICKS</span><span id="p2-panel-name">玩家二</span></div>
    <div class="pick-cards-container" id="p2-pick-cards"></div>
    <div class="ban-section-tray">
      <div class="ban-tray-lbl" style="color:var(--red-team);justify-content:flex-end;">RED BANS</div>
      <div class="ban-cards-grid" id="p2-ban-cards"></div>
    </div>
  </div>

  <!-- 底部栏 -->
  <div id="bottom">
    <div>
      <span id="status-who" style="font-size:16px;font-weight:700;color:var(--blue-team);">玩家一</span>
      <span id="status-phase" style="color:var(--text-muted);font-size:14px;">▸ 选择阶段</span>
    </div>
    <div class="bt-score-digits">
      <span id="score-p1" style="color:var(--blue-team);">0</span>
      <span style="color:var(--gold-hex);opacity:0.6;">:</span>
      <span id="score-p2" style="color:var(--red-team);">0</span>
    </div>
    <div style="text-align:right;font-family:var(--font-esports);font-size:12px;color:var(--gold-hex);">
      WUTHERING WAVES TOURNAMENT
    </div>
  </div>

</div>

<!-- 选角选择弹窗 -->
<div id="char-modal">
  <div class="modal-dialog">
    <div class="modal-header">
      <div class="modal-title" id="modal-pick-title">挑选角色 · SELECT HERO</div>
      <button class="filter-btn" onclick="closeModal()">关 闭</button>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all')">全 部</button>
      <button class="filter-btn" onclick="setFilter('Fusion')">热熔</button>
      <button class="filter-btn" onclick="setFilter('Glacio')">冷凝</button>
      <button class="filter-btn" onclick="setFilter('Electro')">导电</button>
      <button class="filter-btn" onclick="setFilter('Aero')">气动</button>
      <button class="filter-btn" onclick="setFilter('Spectro')">衍射</button>
      <button class="filter-btn" onclick="setFilter('Havoc')">湮灭</button>
      <button class="filter-btn" onclick="setGenFilter(1)">1代主C</button>
      <button class="filter-btn" onclick="setGenFilter(2)">2代主C</button>
      <button class="filter-btn" onclick="setGenFilter(3)">3代主C</button>
      <button class="filter-btn" onclick="setFilter('fourStar')">四星专属</button>
      <input class="search-input" id="search-input" placeholder="搜索角色名..." oninput="renderGrid()">
    </div>
    <div class="char-grid-scroll" id="modal-char-grid"></div>
  </div>
</div>

<script>
const SEQ = [
  { phase: 'ban', player: 1 }, { phase: 'ban', player: 2 },
  { phase: 'ban', player: 1 }, { phase: 'ban', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 1 },
  { phase: 'ban', player: 2 }, { phase: 'ban', player: 1 },
  { phase: 'ban', player: 2 }, { phase: 'ban', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 }
];

let S = {
  p1bans: [], p2bans: [], p1picks: [], p2picks: [],
  step: 0, done: false, scoreP1: 0, scoreP2: 0,
  p1name: '玩家一', p2name: '玩家二'
};

let currentFilter = 'all';
let currentGen = null;
let currentTargetSlot = null; // { side: 'p1'|'p2', type: 'ban'|'pick', idx: number }

function loadState(){
  try {
    const raw = localStorage.getItem('wuwa_bp_state');
    if(raw) S = Object.assign(S, JSON.parse(raw));
  } catch(e){}
}

function saveState(){
  localStorage.setItem('wuwa_bp_state', JSON.stringify(S));
  window.dispatchEvent(new StorageEvent('storage', {key:'wuwa_bp_state'}));
}

function isCharUsed(name){
  const used = [...(S.p1bans||[]), ...(S.p2bans||[]), ...(S.p1picks||[]), ...(S.p2picks||[])];
  return used.some(c => c && c.name === name);
}

function renderUI(){
  document.getElementById('hdr-p1-name').textContent = S.p1name || '玩家一';
  document.getElementById('hdr-p2-name').textContent = S.p2name || '玩家二';
  document.getElementById('p1-panel-name').textContent = S.p1name || '玩家一';
  document.getElementById('p2-panel-name').textContent = S.p2name || '玩家二';
  document.getElementById('score-p1').textContent = S.scoreP1 || 0;
  document.getElementById('score-p2').textContent = S.scoreP2 || 0;

  // Picks
  let p1h = '', p2h = '';
  for(let i=0; i<9; i++){
    const raw1 = S.p1picks[i], raw2 = S.p2picks[i];
    const c1 = raw1 ? (window.getCharInfo ? window.getCharInfo(raw1) : raw1) : null;
    const c2 = raw2 ? (window.getCharInfo ? window.getCharInfo(raw2) : raw2) : null;

    p1h += `<div class="es-pick-card ${c1?'locked blue':''}" onclick="openSlotModal('p1', 'pick', ${i})">
      ${c1 ? `<div class="es-pick-meta"><div class="es-pick-slot-tag">PICK 0${i+1}</div><div class="es-pick-name-zh">${c1.name}</div></div>
              <div class="es-pick-portrait-box"><img class="es-pick-portrait-img" style="object-position:${c1.facePos||'center 22%'};" src="${c1.img}" alt="${c1.name}"></div>`
           : `<div style="padding:12px;font-size:11px;color:rgba(56,189,248,0.3);font-family:var(--font-esports);letter-spacing:3px;">SLOT 0${i+1}</div>`}
    </div>`;

    p2h += `<div class="es-pick-card ${c2?'locked red':''}" onclick="openSlotModal('p2', 'pick', ${i})">
      ${c2 ? `<div class="es-pick-portrait-box"><img class="es-pick-portrait-img" style="object-position:${c2.facePos||'center 22%'};" src="${c2.img}" alt="${c2.name}"></div>
              <div class="es-pick-meta"><div class="es-pick-slot-tag">PICK 0${i+1}</div><div class="es-pick-name-zh">${c2.name}</div></div>`
           : `<div style="padding:12px;font-size:11px;color:rgba(255,51,102,0.3);font-family:var(--font-esports);letter-spacing:3px;">SLOT 0${i+1}</div>`}
    </div>`;
  }
  document.getElementById('p1-pick-cards').innerHTML = p1h;
  document.getElementById('p2-pick-cards').innerHTML = p2h;

  // Bans
  let b1h = '', b2h = '';
  for(let i=0; i<4; i++){
    const b1 = S.p1bans[i], b2 = S.p2bans[i];
    b1h += `<div class="es-ban-slot" onclick="openSlotModal('p1', 'ban', ${i})">
      ${b1 ? `<img class="es-ban-artwork" src="${b1.img}"><div class="es-ban-slash"></div><div class="es-ban-badge-x">✕</div>` : `<span>B${i+1}</span>`}
    </div>`;
    b2h += `<div class="es-ban-slot" onclick="openSlotModal('p2', 'ban', ${i})">
      ${b2 ? `<img class="es-ban-artwork" src="${b2.img}"><div class="es-ban-slash"></div><div class="es-ban-badge-x">✕</div>` : `<span>B${i+1}</span>`}
    </div>`;
  }
  document.getElementById('p1-ban-cards').innerHTML = b1h;
  document.getElementById('p2-ban-cards').innerHTML = b2h;
}

function openSlotModal(side, type, idx){
  currentTargetSlot = { side, type, idx };
  document.getElementById('char-modal').classList.add('show');
  renderGrid();
}

function closeModal(){
  document.getElementById('char-modal').classList.remove('show');
}

function setFilter(el){
  currentFilter = el; currentGen = null;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid();
}

function setGenFilter(gen){
  currentFilter = 'all'; currentGen = gen;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid();
}

function renderGrid(){
  const search = (document.getElementById('search-input').value || '').trim();
  const list = (window.ALL_CHARACTERS || []).filter(c => {
    if(search && !c.name.includes(search) && !c.en.toLowerCase().includes(search.toLowerCase())) return false;
    if(currentGen && c.gen !== currentGen) return false;
    if(currentFilter === 'fourStar' && c.role !== 'fourStar' && c.star !== 4) return false;
    if(currentFilter !== 'all' && currentFilter !== 'fourStar' && c.el !== currentFilter) return false;
    return true;
  });

  let h = '';
  list.forEach(c => {
    const disabled = isCharUsed(c.name);
    h += `<div class="grid-card ${disabled ? 'disabled' : ''}" onclick="selectHero('${c.name}')">
      <img src="${c.img}" alt="${c.name}">
      <div class="grid-card-name">${c.name}</div>
    </div>`;
  });
  document.getElementById('modal-char-grid').innerHTML = h;
}

function selectHero(name){
  if(!currentTargetSlot) return;
  const char = window.getCharInfo ? window.getCharInfo(name) : { name, img: './images/jx.jpg' };
  const { side, type, idx } = currentTargetSlot;
  const arrKey = side === 'p1' ? (type === 'ban' ? 'p1bans' : 'p1picks') : (type === 'ban' ? 'p2bans' : 'p2picks');
  if(!S[arrKey]) S[arrKey] = [];
  S[arrKey][idx] = char;
  saveState();
  closeModal();
  renderUI();
}

loadState();
renderUI();
window.addEventListener('storage', () => { loadState(); renderUI(); });
</script>
</body>
</html>
