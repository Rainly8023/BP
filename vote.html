<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>旧雨杯 · 观众投票</title>
<link rel="stylesheet" href="./theme-wuwa-deep.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --p1g:rgba(255,138,92,0.55);--p2g:rgba(92,183,255,0.5);
}
html,body{width:1920px;height:1080px;overflow:hidden;
  background:linear-gradient(165deg,var(--void) 0%,var(--bg) 50%,#030810 100%);
  font-family:var(--font);color:var(--text);}

/* Background */
#bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 900px 600px at 22% 45%,rgba(255,138,92,0.08) 0%,transparent 65%),
    radial-gradient(ellipse 900px 600px at 78% 50%,rgba(56,189,248,0.1) 0%,transparent 65%),
    radial-gradient(ellipse 1000px 700px at 50% 35%,rgba(34,211,238,0.06) 0%,transparent 72%),
    var(--bg);}
#bg::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(56,189,248,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.05) 1px,transparent 1px);
  background-size:60px 60px;}
#wuwa-deco-vote{position:fixed;right:-2%;bottom:0;z-index:2;width:min(34vw,520px);height:85%;pointer-events:none;opacity:0.11;
  background:url('./images/pd.jpg') right bottom/contain no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,0.45) 38%,#000);mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,0.45) 38%,#000);}
#pcanvas{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* Borders */
.fl-top,.fl-bottom{position:fixed;left:0;right:0;height:3px;z-index:25;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--ice2) 14%,var(--ice3) 38%,#fff 50%,var(--ice3) 62%,var(--ice2) 86%,transparent);
  box-shadow:0 0 16px var(--ice-glow),0 0 40px var(--ice-shadow);}
.fl-top{top:0;}.fl-bottom{bottom:0;}
.fl-left,.fl-right{position:fixed;top:0;bottom:0;width:3px;z-index:25;pointer-events:none;
  background:linear-gradient(180deg,transparent,var(--ice2) 20%,var(--ice1) 50%,var(--ice2) 80%,transparent);
  box-shadow:0 0 16px var(--ice-glow);}
.fl-left{left:0;}.fl-right{right:0;}
.fc{position:fixed;z-index:26;pointer-events:none;}
.fc.tl{top:0;left:0;width:60px;height:60px;border-top:3px solid var(--ice1);border-left:3px solid var(--ice1);}
.fc.tr{top:0;right:0;width:60px;height:60px;border-top:3px solid var(--ice1);border-right:3px solid var(--ice1);}
.fc.bl{bottom:0;left:0;width:60px;height:60px;border-bottom:3px solid var(--ice1);border-left:3px solid var(--ice1);}
.fc.br{bottom:0;right:0;width:60px;height:60px;border-bottom:3px solid var(--ice1);border-right:3px solid var(--ice1);}

/* Center divider line */
#center-line{position:fixed;left:50%;top:0;bottom:0;width:1px;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,transparent 5%,rgba(34,211,238,0.12) 30%,rgba(56,189,248,0.22) 50%,rgba(34,211,238,0.12) 70%,transparent 95%);}

/* Main layout */
#app{position:relative;z-index:10;width:1920px;height:1080px;display:flex;flex-direction:column;}

/* Top header */
#vote-header{
  height:72px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(8,16,28,0.92) 0%,rgba(6,12,22,0.78) 100%);
  border-bottom:1px solid rgba(56,189,248,0.18);
  position:relative;flex-shrink:0;
}
#vote-header::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--ice-glow),transparent);}
#vote-title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;letter-spacing:10px;
  color:var(--ink-display);text-shadow:0 0 28px rgba(34,211,238,0.25);text-transform:uppercase;}
#vote-status{position:absolute;right:40px;display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:3px;}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);
  box-shadow:0 0 8px var(--teal);animation:dotpulse 1.2s ease-in-out infinite;}
@keyframes dotpulse{0%,100%{opacity:0.5;transform:scale(0.9);}50%{opacity:1;transform:scale(1.1);}}
#status-dot.closed{background:#e06060;box-shadow:0 0 8px #e06060;animation:none;}
#status-text{color:var(--teal);}
#status-text.closed{color:#e06060;}
#vote-badge{position:absolute;left:40px;font-size:11px;letter-spacing:3px;
  color:var(--ink-ghost);padding:3px 12px;border:1px solid rgba(56,189,248,0.22);border-radius:2px;}

/* Main vote area */
#vote-main{flex:1;display:grid;grid-template-columns:1fr auto 1fr;position:relative;}

/* Player vote panel */
.vote-panel{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 80px;gap:32px;position:relative;overflow:hidden;
}
.vote-panel::before{content:'';position:absolute;inset:0;transition:opacity 0.5s;}
#p1-panel::before{background:radial-gradient(ellipse 600px 500px at 30% 50%,rgba(232,92,48,0.08) 0%,transparent 70%);}
#p2-panel::before{background:radial-gradient(ellipse 600px 500px at 70% 50%,rgba(58,143,255,0.08) 0%,transparent 70%);}
.vote-panel.winner::before{opacity:1!important;}
#p1-panel.winner::before{background:radial-gradient(ellipse 700px 600px at 30% 50%,rgba(232,92,48,0.18) 0%,transparent 70%);}
#p2-panel.winner::before{background:radial-gradient(ellipse 700px 600px at 70% 50%,rgba(58,143,255,0.18) 0%,transparent 70%);}

.player-name-vote{
  font-family:'Oswald',sans-serif;font-size:52px;font-weight:700;letter-spacing:6px;
  text-align:center;line-height:1;
}
.player-name-vote.p1{color:var(--p1);text-shadow:0 0 30px var(--p1g),0 0 60px rgba(232,92,48,0.2);}
.player-name-vote.p2{color:var(--p2);text-shadow:0 0 30px var(--p2g),0 0 60px rgba(58,143,255,0.2);}

.player-sub-vote{font-size:11px;letter-spacing:4px;color:var(--ink-ghost-2);margin-top:-20px;}

/* Vote count display */
.vote-count-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.vote-count{
  font-family:'Oswald',sans-serif;font-size:100px;font-weight:700;line-height:1;
  transition:all 0.3s;
}
.vote-count.p1c{color:var(--p1);text-shadow:0 0 40px var(--p1g);}
.vote-count.p2c{color:var(--p2);text-shadow:0 0 40px var(--p2g);}
.vote-label{font-size:10px;letter-spacing:4px;color:var(--ink-ghost-3);}

/* Percentage */
.vote-pct{
  font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;letter-spacing:3px;
  transition:all 0.5s;
}
.vote-pct.p1c{color:rgba(232,92,48,0.7);}
.vote-pct.p2c{color:rgba(58,143,255,0.7);}

/* Progress bar */
.vote-bar-wrap{width:100%;display:flex;flex-direction:column;gap:6px;}
.vote-bar-bg{width:100%;height:8px;background:rgba(12,24,40,0.85);border-radius:4px;overflow:hidden;border:1px solid rgba(56,189,248,0.12);}
.vote-bar-fill{height:100%;border-radius:4px;transition:width 0.7s cubic-bezier(0.4,0,0.2,1);}
#p1-bar-fill{background:linear-gradient(90deg,rgba(180,50,20,0.8),var(--p1),#ff8860);}
#p2-bar-fill{background:linear-gradient(90deg,rgba(20,80,180,0.8),var(--p2),#70b0ff);
  float:right;/* fill from right for p2 */}
.bar-labels{display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;color:var(--ink-ghost-3);}

/* Winner crown */
.winner-crown{font-size:40px;opacity:0;transition:opacity 0.5s;
  filter:drop-shadow(0 0 12px rgba(212,160,32,0.7));}
.winner-crown.show{opacity:1;animation:crownf 1.5s ease-in-out infinite;}
@keyframes crownf{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

/* Center VS column */
#vote-center{
  width:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  position:relative;z-index:10;
}
#vs-text{font-family:'Oswald',sans-serif;font-size:48px;font-weight:700;letter-spacing:6px;
  color:rgba(56,189,248,0.22);}

/* Unified bar (full width) */
#unified-bar-wrap{position:absolute;bottom:100px;left:80px;right:80px;z-index:10;}
#unified-label{font-size:9px;letter-spacing:4px;color:var(--ink-ghost-3);text-align:center;margin-bottom:6px;}
#unified-bar-bg{width:100%;height:10px;background:rgba(12,24,40,0.88);border-radius:5px;overflow:hidden;display:flex;border:1px solid rgba(56,189,248,0.12);}
#unified-p1{height:100%;background:linear-gradient(90deg,rgba(180,50,20,0.9),var(--p1));
  transition:width 0.7s cubic-bezier(0.4,0,0.2,1);border-radius:5px 0 0 5px;}
#unified-p2{height:100%;background:linear-gradient(90deg,var(--p2),rgba(20,80,180,0.9));
  transition:width 0.7s cubic-bezier(0.4,0,0.2,1);flex:1;border-radius:0 5px 5px 0;}
#unified-names{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;letter-spacing:2px;}
#u-p1-label{color:rgba(232,92,48,0.6);}
#u-p2-label{color:rgba(58,143,255,0.6);}

/* Bottom instruction */
#vote-footer{
  height:68px;display:flex;align-items:center;justify-content:center;gap:0;
  background:linear-gradient(0deg,rgba(6,12,22,0.95) 0%,rgba(8,16,28,0.82) 100%);
  border-top:1px solid rgba(56,189,248,0.16);
  flex-shrink:0;position:relative;
}
#vote-footer::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,0.22),transparent);}
#vote-instruction{
  font-size:16px;letter-spacing:6px;color:var(--ink-ghost);
  animation:blink 2.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:0.4;}50%{opacity:0.85;}}
#vote-instruction span.p1t{color:rgba(232,92,48,0.8);}
#vote-instruction span.p2t{color:rgba(58,143,255,0.8);}
#vote-instruction span.num{color:var(--ice2);font-weight:700;}
#vote-closed-msg{
  display:none;font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;letter-spacing:8px;
  color:var(--gold);text-shadow:0 0 20px rgba(212,160,32,0.5);
  animation:goldglow 1.5s ease-in-out infinite;
}
#vote-closed-msg.show{display:block;}
#vote-instruction.hide{display:none;}
@keyframes goldglow{0%,100%{text-shadow:0 0 20px rgba(212,160,32,0.4);}50%{text-shadow:0 0 40px rgba(212,160,32,0.8),0 0 80px rgba(212,160,32,0.3);}}

/* ─── Control Panel ─── */
#ctrl-panel{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  z-index:50;
  background:rgba(8,16,28,0.96);
  border:1px solid rgba(56,189,248,0.28);
  border-bottom:none;
  border-radius:6px 6px 0 0;
  padding:14px 24px 10px;
  display:flex;flex-direction:column;gap:10px;
  min-width:760px;
  transition:transform 0.3s ease,opacity 0.3s ease;
  box-shadow:0 -12px 40px rgba(0,0,0,0.45);
}
#ctrl-panel.hidden{transform:translateX(-50%) translateY(100%);opacity:0;pointer-events:none;}
#ctrl-toggle-hint{
  position:fixed;bottom:6px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:3px;color:var(--ink-ghost-2);z-index:51;
  background:rgba(8,16,28,0.92);padding:2px 10px;border-radius:2px;
  pointer-events:none;border:1px solid rgba(56,189,248,0.2);
}
#ctrl-panel.hidden ~ #ctrl-toggle-hint{opacity:1;}

#ctrl-title{font-size:10px;letter-spacing:4px;color:var(--ink-ghost);
  border-bottom:1px solid rgba(56,189,248,0.18);padding-bottom:6px;text-align:center;}
#ctrl-row1{display:flex;gap:10px;align-items:center;justify-content:center;}
#ctrl-row2{display:flex;gap:10px;align-items:center;justify-content:center;}

.ctrl-section{display:flex;flex-direction:column;gap:6px;align-items:center;}
.ctrl-sec-label{font-size:9px;letter-spacing:2px;color:var(--muted);}
.ctrl-btns{display:flex;gap:5px;align-items:center;}
.cb{font-family:var(--font);font-size:10px;letter-spacing:1px;
  padding:5px 12px;border-radius:2px;cursor:pointer;transition:all 0.12s;
  border:1px solid rgba(56,189,248,0.35);color:var(--ink-accent);background:rgba(34,211,238,0.06);}
.cb:hover{background:rgba(34,211,238,0.14);}
.cb.p1b{border-color:rgba(232,92,48,0.45);color:var(--p1);background:rgba(232,92,48,0.08);}
.cb.p1b:hover{background:rgba(232,92,48,0.18);}
.cb.p2b{border-color:rgba(58,143,255,0.45);color:var(--p2);background:rgba(58,143,255,0.08);}
.cb.p2b:hover{background:rgba(58,143,255,0.18);}
.cb.green{border-color:rgba(32,200,160,0.45);color:var(--teal);background:rgba(32,200,160,0.08);}
.cb.green:hover{background:rgba(32,200,160,0.2);}
.cb.gold{border-color:rgba(212,160,32,0.45);color:var(--gold);background:rgba(212,160,32,0.08);}
.cb.gold:hover{background:rgba(212,160,32,0.18);}
.cb.red{border-color:rgba(200,50,50,0.4);color:#e06060;background:rgba(180,20,20,0.1);}
.cb.red:hover{background:rgba(200,50,50,0.2);}
.cb.lg{padding:5px 20px;font-size:11px;}
.ctrl-div{width:1px;height:32px;background:rgba(56,189,248,0.22);margin:0 6px;}
.ctrl-num{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;
  min-width:40px;text-align:center;}
.ctrl-num.p1n{color:var(--p1);}.ctrl-num.p2n{color:var(--p2);}
.ctrl-name-input{background:rgba(6,14,26,0.9);border:1px solid rgba(56,189,248,0.28);
  border-radius:2px;color:var(--text);font-family:var(--font);font-size:12px;
  padding:4px 10px;outline:none;width:110px;text-align:center;}
.ctrl-name-input:focus{border-color:var(--ice2);}
</style>
</head>
<body>
<div id="bg"></div>
<div id="wuwa-deco-vote" aria-hidden="true"></div>
<canvas id="pcanvas"></canvas>
<div class="fl-top"></div><div class="fl-bottom"></div>
<div class="fl-left"></div><div class="fl-right"></div>
<div class="fc tl"></div><div class="fc tr"></div><div class="fc bl"></div><div class="fc br"></div>
<div id="center-line"></div>

<div id="app">
  <div id="vote-header">
    <div id="vote-badge">旧 雨 杯</div>
    <div id="vote-title">观 众 投 票</div>
    <div id="vote-status">
      <div id="status-dot"></div>
      <span id="status-text">投票进行中</span>
    </div>
  </div>

  <div id="vote-main">
    <!-- P1 -->
    <div class="vote-panel" id="p1-panel">
      <div class="winner-crown" id="p1-crown">👑</div>
      <div class="player-name-vote p1" id="v-p1-name">玩家一</div>
      <div class="player-sub-vote">PLAYER 1</div>
      <div class="vote-count-wrap">
        <div class="vote-count p1c" id="v-p1-count">0</div>
        <div class="vote-label">VOTES</div>
      </div>
      <div class="vote-pct p1c" id="v-p1-pct">0%</div>
      <div class="vote-bar-wrap">
        <div class="vote-bar-bg"><div class="vote-bar-fill" id="p1-bar-fill" style="width:0%"></div></div>
        <div class="bar-labels"><span>0票</span><span id="p1-bar-label">0%</span></div>
      </div>
    </div>

    <!-- Center -->
    <div id="vote-center">
      <div id="vs-text">VS</div>
    </div>

    <!-- P2 -->
    <div class="vote-panel" id="p2-panel">
      <div class="winner-crown" id="p2-crown">👑</div>
      <div class="player-name-vote p2" id="v-p2-name">玩家二</div>
      <div class="player-sub-vote">PLAYER 2</div>
      <div class="vote-count-wrap">
        <div class="vote-count p2c" id="v-p2-count">0</div>
        <div class="vote-label">VOTES</div>
      </div>
      <div class="vote-pct p2c" id="v-p2-pct">0%</div>
      <div class="vote-bar-wrap">
        <div class="vote-bar-bg"><div class="vote-bar-fill" id="p2-bar-fill" style="width:0%"></div></div>
        <div class="bar-labels"><span>0票</span><span id="p2-bar-label">0%</span></div>
      </div>
    </div>
  </div>

  <!-- Unified bar -->
  <div id="unified-bar-wrap">
    <div id="unified-label">VOTE DISTRIBUTION</div>
    <div id="unified-bar-bg">
      <div id="unified-p1" style="width:50%"></div>
      <div id="unified-p2" style="width:50%"></div>
    </div>
    <div id="unified-names">
      <span id="u-p1-label">玩家一</span>
      <span id="u-p2-label">玩家二</span>
    </div>
  </div>

  <div id="vote-footer">
    <div id="vote-instruction">
      发弹幕 <span class="num">「 1 」</span> 支持 <span class="p1t" id="inst-p1">玩家一</span>
      &nbsp;·&nbsp;
      发弹幕 <span class="num">「 2 」</span> 支持 <span class="p2t" id="inst-p2">玩家二</span>
    </div>
    <div id="vote-closed-msg">— 投票已截止 · 预测结果揭晓 —</div>
  </div>
</div>

<!-- Control Panel (Press C to toggle) -->
<div id="ctrl-panel">
  <div id="ctrl-title">观众投票控制台 · 按 C 键显示/隐藏</div>
  <div id="ctrl-row1">
    <div class="ctrl-section">
      <div class="ctrl-sec-label">P1 名称</div>
      <input class="ctrl-name-input" id="inp-p1" value="玩家一" oninput="updateNames()">
    </div>
    <div class="ctrl-div"></div>
    <div class="ctrl-section">
      <div class="ctrl-sec-label" style="color:var(--p1)">P1 票数</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="ctrl-num p1n" id="cp1-num">0</span>
        <div class="ctrl-btns">
          <button class="cb p1b" onclick="addVote(1,1)">+1</button>
          <button class="cb p1b" onclick="addVote(1,5)">+5</button>
          <button class="cb p1b" onclick="addVote(1,10)">+10</button>
          <button class="cb red" onclick="addVote(1,-1)">−1</button>
        </div>
      </div>
    </div>
    <div class="ctrl-div"></div>
    <div class="ctrl-section">
      <div class="ctrl-sec-label" style="color:var(--p2)">P2 票数</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="ctrl-num p2n" id="cp2-num">0</span>
        <div class="ctrl-btns">
          <button class="cb p2b" onclick="addVote(2,1)">+1</button>
          <button class="cb p2b" onclick="addVote(2,5)">+5</button>
          <button class="cb p2b" onclick="addVote(2,10)">+10</button>
          <button class="cb red" onclick="addVote(2,-1)">−1</button>
        </div>
      </div>
    </div>
    <div class="ctrl-div"></div>
    <div class="ctrl-section">
      <div class="ctrl-sec-label">P2 名称</div>
      <input class="ctrl-name-input" id="inp-p2" value="玩家二" oninput="updateNames()">
    </div>
  </div>
  <div id="ctrl-row2">
    <button class="cb green lg" onclick="openVote()">▶ 开启投票</button>
    <button class="cb gold lg" onclick="closeVote()">■ 截止投票 · 揭晓</button>
    <button class="cb lg" onclick="syncFromBP()">从 BP 同步名称</button>
    <button class="cb red lg" onclick="resetVote()">重置清零</button>
  </div>
</div>
<div id="ctrl-toggle-hint">按 C 显示控制面板</div>

<script>
// Particles
(function(){
  const c=document.getElementById('pcanvas'),x=c.getContext('2d');
  c.width=1920;c.height=1080;
  const pts=Array.from({length:40},()=>({
    px:Math.random()*1920,py:Math.random()*1080,
    r:Math.random()*1.5+0.4,
    vx:(Math.random()-0.5)*0.2,vy:-(Math.random()*0.3+0.04),
    a:Math.random()*0.3+0.06,
    col:Math.random()>0.5?'rgba(168,216,247,':'rgba(212,160,32,'
  }));
  function draw(){
    x.clearRect(0,0,1920,1080);
    pts.forEach(p=>{
      x.beginPath();x.arc(p.px,p.py,p.r,0,Math.PI*2);
      x.fillStyle=p.col+p.a+')';x.fill();
      p.px+=p.vx;p.py+=p.vy;
      if(p.py<-10){p.py=1090;p.px=Math.random()*1920;}
      if(p.px<-10)p.px=1930;if(p.px>1930)p.px=-10;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

let V={p1:0,p2:0,p1name:'玩家一',p2name:'玩家二',open:true};

function saveVote(){localStorage.setItem('wuwa_vote',JSON.stringify(V));}

function addVote(player,n){
  if(player===1)V.p1=Math.max(0,V.p1+n);
  else V.p2=Math.max(0,V.p2+n);
  saveVote();renderVote();
}

function updateNames(){
  V.p1name=document.getElementById('inp-p1').value||'玩家一';
  V.p2name=document.getElementById('inp-p2').value||'玩家二';
  saveVote();renderVote();
}

function openVote(){
  V.open=true;saveVote();
  const dot=document.getElementById('status-dot');
  const stxt=document.getElementById('status-text');
  dot.className='';stxt.className='';stxt.textContent='投票进行中';
  document.getElementById('vote-instruction').classList.remove('hide');
  document.getElementById('vote-closed-msg').classList.remove('show');
  document.getElementById('p1-crown').classList.remove('show');
  document.getElementById('p2-crown').classList.remove('show');
  document.getElementById('p1-panel').classList.remove('winner');
  document.getElementById('p2-panel').classList.remove('winner');
}

function closeVote(){
  V.open=false;saveVote();
  const dot=document.getElementById('status-dot');
  const stxt=document.getElementById('status-text');
  dot.className='closed';stxt.className='closed';stxt.textContent='投票已截止';
  document.getElementById('vote-instruction').classList.add('hide');
  document.getElementById('vote-closed-msg').classList.add('show');
  // Show winner crown
  const winner=V.p1>=V.p2?'p1':'p2';
  document.getElementById('p1-crown').classList.toggle('show',winner==='p1');
  document.getElementById('p2-crown').classList.toggle('show',winner==='p2');
  document.getElementById('p1-panel').classList.toggle('winner',winner==='p1');
  document.getElementById('p2-panel').classList.toggle('winner',winner==='p2');
}

function resetVote(){
  V.p1=0;V.p2=0;V.open=true;
  saveVote();openVote();renderVote();
}

function syncFromBP(){
  try{
    const S=JSON.parse(localStorage.getItem('wuwa_bp_state')||'{}');
    if(S.p1name){V.p1name=S.p1name;document.getElementById('inp-p1').value=S.p1name;}
    if(S.p2name){V.p2name=S.p2name;document.getElementById('inp-p2').value=S.p2name;}
    saveVote();renderVote();
  }catch(e){}
}

function renderVote(){
  const total=V.p1+V.p2;
  const p1pct=total>0?Math.round((V.p1/total)*100):50;
  const p2pct=total>0?Math.round((V.p2/total)*100):50;

  document.getElementById('v-p1-name').textContent=V.p1name;
  document.getElementById('v-p2-name').textContent=V.p2name;
  document.getElementById('inst-p1').textContent=V.p1name;
  document.getElementById('inst-p2').textContent=V.p2name;
  document.getElementById('u-p1-label').textContent=V.p1name;
  document.getElementById('u-p2-label').textContent=V.p2name;

  document.getElementById('v-p1-count').textContent=V.p1;
  document.getElementById('v-p2-count').textContent=V.p2;
  document.getElementById('v-p1-pct').textContent=p1pct+'%';
  document.getElementById('v-p2-pct').textContent=p2pct+'%';
  document.getElementById('p1-bar-label').textContent=p1pct+'%';
  document.getElementById('p2-bar-label').textContent=p2pct+'%';
  document.getElementById('p1-bar-fill').style.width=p1pct+'%';
  document.getElementById('p2-bar-fill').style.width=p2pct+'%';
  document.getElementById('unified-p1').style.width=p1pct+'%';
  document.getElementById('unified-p2').style.width=p2pct+'%';

  document.getElementById('cp1-num').textContent=V.p1;
  document.getElementById('cp2-num').textContent=V.p2;
}

// Toggle control panel with C key
let ctrlVisible=true;
document.addEventListener('keydown',e=>{
  if(e.key==='c'||e.key==='C'){
    ctrlVisible=!ctrlVisible;
    document.getElementById('ctrl-panel').classList.toggle('hidden',!ctrlVisible);
  }
  // Keyboard shortcuts: 1 / 2 to quick add vote
  if(e.key==='1'&&e.shiftKey){addVote(1,1);}
  if(e.key==='2'&&e.shiftKey){addVote(2,1);}
});

// Init from localStorage
try{
  const saved=JSON.parse(localStorage.getItem('wuwa_vote')||'null');
  if(saved){V=saved;}
}catch(e){}
syncFromBP();
renderVote();
</script>
</body>
</html>
