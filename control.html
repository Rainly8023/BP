<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>旧雨杯 · BP 赛事总控制台</title>
<link rel="stylesheet" href="./theme-wuwa-deep.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@600;700&family=Oswald:wght@500;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue-team: #00d2ff;
  --blue-glow: rgba(0, 210, 255, 0.55);
  --red-team: #ff3366;
  --red-glow: rgba(255, 51, 102, 0.55);
  --ban-red: #ff2233;
  --gold-hex: #e5b960;
  --gold-glow: rgba(229, 185, 96, 0.55);
  --teal: #20e8a0;

  --bg: #030712;
  --panel: rgba(8, 16, 36, 0.95);
  --panel-border: rgba(56, 189, 248, 0.25);
  --text-main: #f0f6fc;
  --text-muted: #7390b0;

  --font-esports: 'Rajdhani', 'Oswald', 'Noto Sans SC', sans-serif;
  --font-title: 'Oswald', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', sans-serif;
}

html, body {
  width: 100%; min-height: 100vh;
  background: var(--bg);
  color: var(--text-main);
  font-family: var(--font-body);
  padding: 16px 20px;
}

/* 赛博网格背景 */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0;
  background-image:
    radial-gradient(ellipse 1000px 600px at 50% 10%, rgba(0, 160, 255, 0.08) 0%, transparent 60%),
    linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
  background-size: 100% 100%, 40px 40px, 40px 40px;
  pointer-events: none;
}

#ctrl-app {
  position: relative; z-index: 10;
  max-width: 1320px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 12px;
}

/* 顶部控制台标题 */
#ctrl-header {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 12px 20px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}
.ctrl-title { font-family: var(--font-title); font-size: 18px; font-weight: 700; letter-spacing: 3px; color: var(--gold-hex); }
.ctrl-badge {
  font-size: 11px; padding: 3px 12px; border-radius: 3px;
  border: 1px solid rgba(56, 189, 248, 0.35); color: var(--blue-team);
  background: rgba(0, 210, 255, 0.08); font-weight: 700; letter-spacing: 2px;
}
.sync-status {
  font-size: 11px; padding: 3px 12px; border-radius: 3px;
  border: 1px solid var(--teal); color: var(--teal);
  background: rgba(32, 232, 160, 0.08); font-weight: 700; letter-spacing: 2px;
}

/* 赛制模式切换 */
#mode-toggle-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--panel);
  border: 1px solid var(--panel-border); border-radius: 6px;
}
.mode-badge {
  font-family: var(--font-esports); font-size: 11px; font-weight: 700; letter-spacing: 2px;
  padding: 4px 12px; border-radius: 3px; background: rgba(255, 51, 102, 0.15);
  border: 1px solid rgba(255, 51, 102, 0.4); color: var(--red-team);
}
.mode-btn {
  flex: 1; padding: 8px 16px; border-radius: 4px; cursor: pointer;
  font-family: var(--font-esports); font-size: 12px; font-weight: 700; letter-spacing: 2px;
  background: rgba(14, 28, 56, 0.6); color: var(--text-muted);
  border: 1px solid rgba(56, 189, 248, 0.25); transition: all 0.2s;
}
.mode-btn:hover { color: #fff; border-color: var(--blue-team); }
.mode-btn.m-active {
  background: rgba(0, 210, 255, 0.15); border-color: var(--blue-team);
  color: var(--blue-team); box-shadow: 0 0 16px rgba(0, 210, 255, 0.25);
}

/* 选手名称输入区 */
#player-names {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.name-block {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 12px 16px; display: flex; flex-direction: column; gap: 6px;
}
.name-block label { font-family: var(--font-esports); font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--text-muted); }
.name-input {
  background: rgba(4, 10, 24, 0.85); border: 1px solid var(--panel-border); border-radius: 4px;
  color: #fff; font-family: var(--font-title); font-size: 14px; font-weight: 700;
  padding: 6px 12px; outline: none; letter-spacing: 1px; width: 100%;
}
.name-input:focus { border-color: var(--blue-team); box-shadow: 0 0 10px var(--blue-glow); }
.name-sub-input {
  background: rgba(4, 10, 24, 0.85); border: 1px solid rgba(56, 189, 248, 0.15); border-radius: 4px;
  color: var(--text-muted); font-size: 11px; padding: 4px 12px; outline: none; width: 100%;
}

/* 主网格：左侧控制 / 右侧选角 */
#main-grid {
  display: grid; grid-template-columns: 340px 1fr; gap: 12px;
}

/* BP 状态与操作栏 */
#bp-status {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.sec-title {
  font-family: var(--font-esports); font-size: 10px; font-weight: 700; letter-spacing: 3px;
  color: var(--text-muted); text-transform: uppercase; padding-bottom: 4px;
  border-bottom: 1px solid rgba(56, 189, 248, 0.15);
}

.seq-list-box {
  display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto;
  padding-right: 4px;
}
.seq-row-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 700;
  background: rgba(4, 10, 24, 0.6); border: 1px solid rgba(56, 189, 248, 0.1);
}
.seq-row-item.cur { border-color: var(--gold-hex); background: rgba(229, 185, 96, 0.15); }
.seq-row-item.done { opacity: 0.5; }

.action-control-box {
  background: rgba(4, 10, 24, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 4px;
  padding: 10px; display: flex; flex-direction: column; gap: 8px;
}
.action-target-label { font-family: var(--font-title); font-size: 15px; font-weight: 700; letter-spacing: 2px; }
.action-selected-text {
  font-size: 13px; font-weight: 700; color: var(--gold-hex);
  padding: 6px 10px; background: rgba(0, 0, 0, 0.5); border-radius: 3px;
  border: 1px solid rgba(229, 185, 96, 0.3); text-align: center;
}

.timer-control-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.dur-btn-group { display: flex; gap: 4px; }
.dur-btn {
  padding: 4px 8px; border-radius: 3px; font-family: var(--font-esports); font-size: 11px; font-weight: 700;
  background: rgba(14, 28, 56, 0.6); color: var(--text-muted); border: 1px solid rgba(56, 189, 248, 0.2);
  cursor: pointer; transition: all 0.15s;
}
.dur-btn.t-active { background: rgba(229, 185, 96, 0.2); border-color: var(--gold-hex); color: var(--gold-hex); }

.btn-ctrl-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px;
}
.btn-action {
  padding: 8px 12px; border-radius: 4px; cursor: pointer;
  font-family: var(--font-title); font-size: 12px; font-weight: 700; letter-spacing: 2px;
  border: 1px solid transparent; transition: all 0.2s;
}
.btn-action.confirm {
  background: rgba(0, 210, 255, 0.2); border-color: var(--blue-team); color: var(--blue-team);
  grid-column: 1 / -1;
}
.btn-action.confirm:hover:not(:disabled) { background: var(--blue-team); color: #000; }
.btn-action.confirm:disabled { opacity: 0.25; cursor: not-allowed; }
.btn-action.random { background: rgba(32, 232, 160, 0.15); border-color: var(--teal); color: var(--teal); }
.btn-action.skip { background: rgba(255, 51, 102, 0.15); border-color: var(--red-team); color: var(--red-team); }
.btn-action.reset { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2); color: var(--text-muted); grid-column: 1 / -1; }

/* 比分控制 */
.score-ctrl-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.score-card {
  background: rgba(4, 10, 24, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 4px;
  padding: 8px 10px; display: flex; align-items: center; justify-content: space-between;
}
.score-num-text { font-family: var(--font-title); font-size: 22px; font-weight: 700; }
.score-btn-group { display: flex; gap: 4px; }
.score-btn-small {
  width: 26px; height: 26px; border-radius: 3px; font-size: 14px; font-weight: 700;
  cursor: pointer; background: rgba(14, 28, 56, 0.8); border: 1px solid rgba(56, 189, 248, 0.3); color: #fff;
}

/* 角色面板 */
#char-panel {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.char-filter-bar {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.c-filter-btn {
  font-family: var(--font-esports); font-size: 11px; font-weight: 700; letter-spacing: 1px;
  padding: 3px 10px; border-radius: 3px; cursor: pointer;
  background: rgba(14, 28, 56, 0.6); color: var(--text-muted); border: 1px solid rgba(56, 189, 248, 0.25);
}
.c-filter-btn.active, .c-filter-btn:hover { background: var(--blue-team); color: #000; border-color: var(--blue-team); }

.char-search-input {
  background: rgba(4, 10, 24, 0.85); border: 1px solid var(--panel-border); border-radius: 4px;
  color: #fff; font-size: 12px; padding: 5px 12px; outline: none; margin-left: auto; width: 180px;
}

.char-grid-area {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px;
  max-height: 480px; overflow-y: auto; padding-right: 4px;
}

.c-card {
  height: 115px; border-radius: 4px; position: relative; overflow: hidden;
  background: rgba(4, 10, 24, 0.85); border: 1px solid rgba(56, 189, 248, 0.2);
  cursor: pointer; transition: all 0.2s;
}
.c-card:hover { border-color: var(--blue-team); transform: translateY(-2px); box-shadow: 0 4px 14px var(--blue-glow); }
.c-card.selected { border: 2px solid var(--gold-hex); box-shadow: 0 0 16px var(--gold-glow); }
.c-card.disabled { filter: grayscale(1); opacity: 0.25; cursor: not-allowed; }

.c-card img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; }
.c-card-name {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 3px 4px;
  background: linear-gradient(0deg, rgba(2, 6, 18, 0.98), transparent);
  font-size: 10px; font-weight: 700; text-align: center; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 全息战略控制栏 */
#holo-ctrl-panel {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
}
.holo-enemy-inputs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.holo-in-box {
  background: rgba(4, 10, 24, 0.8); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 3px;
  color: #fff; font-size: 11px; padding: 4px 8px; text-align: center; outline: none;
}

#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 8px 24px; border-radius: 4px; background: rgba(0, 210, 255, 0.95);
  color: #000; font-family: var(--font-title); font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999;
}
#toast.show { opacity: 1; }

</style>
<script src="./characters-data.js"></script>
<script src="./mqtt.min.js"></script>
<script src="./sync-config.js"></script>
</head>
<body>

<div id="ctrl-app">

  <!-- 顶部控制头 -->
  <div id="ctrl-header">
    <div class="ctrl-title">旧雨杯 · BP 赛事总控制台</div>
    <div class="ctrl-badge">导播操作端 · 观众不可见</div>
    <div class="sync-status" id="sync-status">● 实时同步已就绪</div>
  </div>

  <!-- 模式切换 -->
  <div id="mode-toggle-bar">
    <div class="mode-badge" id="mode-badge">16强 · BAN/PICK</div>
    <button class="mode-btn m-active" id="btn-mode-bp" onclick="setMode('ban_pick')">⚔ 16强淘汰赛 · BAN / PICK</button>
    <button class="mode-btn" id="btn-mode-pick" onclick="setMode('pick_only')">◈ 24进16 · 仅选角色</button>
  </div>

  <!-- 选手信息 -->
  <div id="player-names">
    <div class="name-block">
      <label style="color:var(--blue-team);">P1 蓝方选手名称</label>
      <input class="name-input" id="p1-name-in" value="玩家一" oninput="syncNames()">
      <input class="name-sub-input" id="p1-sub-in" value="旧雨杯参赛选手" oninput="syncNames()">
    </div>
    <div class="name-block">
      <label style="color:var(--red-team);">P2 红方选手名称</label>
      <input class="name-input" id="p2-name-in" value="玩家二" oninput="syncNames()">
      <input class="name-sub-input" id="p2-sub-in" value="旧雨杯参赛选手" oninput="syncNames()">
    </div>
  </div>

  <!-- 主操作网格 -->
  <div id="main-grid">

    <!-- 左侧进度与操作 -->
    <div id="bp-status">
      <div class="sec-title">BP 序列进度</div>
      <div class="seq-list-box" id="seq-list"></div>

      <div class="sec-title" style="margin-top:4px;">当前回合操作</div>
      <div class="action-control-box">
        <div class="action-target-label" id="action-label">玩家一 · 禁用阶段</div>
        <div class="action-selected-text" id="action-selected">— 请在右侧选择角色 —</div>

        <div class="timer-control-row">
          <span style="font-size:11px;font-weight:700;color:var(--text-muted);">思考倒计时:</span>
          <div class="dur-btn-group">
            <button class="dur-btn" data-dur="30" onclick="setTimerDur(30)">30s</button>
            <button class="dur-btn t-active" data-dur="60" onclick="setTimerDur(60)">60s</button>
            <button class="dur-btn" data-dur="90" onclick="setTimerDur(90)">90s</button>
            <button class="dur-btn" data-dur="0" onclick="setTimerDur(0)">∞</button>
          </div>
        </div>

        <div class="btn-ctrl-grid">
          <button class="btn-action confirm" id="confirm-btn" onclick="confirmAction()" disabled>确 认 提 交 [Enter]</button>
          <button class="btn-action random" onclick="randomPick()">随 机</button>
          <button class="btn-action skip" onclick="skipAction()">跳 过</button>
          <button class="btn-action reset" onclick="resetBP()">重 置 整 场 BP</button>
        </div>
      </div>

      <div class="sec-title" style="margin-top:4px;">大比分调整</div>
      <div class="score-ctrl-row">
        <div class="score-card">
          <div><div style="font-size:10px;color:var(--blue-team);font-weight:700;">蓝方 P1</div><div class="score-num-text" id="sc1" style="color:var(--blue-team);">0</div></div>
          <div class="score-btn-group">
            <button class="score-btn-small" onclick="adjScore(1,1)">＋</button>
            <button class="score-btn-small" onclick="adjScore(1,-1)">－</button>
          </div>
        </div>
        <div class="score-card">
          <div><div style="font-size:10px;color:var(--red-team);font-weight:700;">红方 P2</div><div class="score-num-text" id="sc2" style="color:var(--red-team);">0</div></div>
          <div class="score-btn-group">
            <button class="score-btn-small" onclick="adjScore(2,1)">＋</button>
            <button class="score-btn-small" onclick="adjScore(2,-1)">－</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧全角色库 -->
    <div id="char-panel">
      <div class="sec-title">选择角色</div>
      <div class="char-filter-bar">
        <button class="c-filter-btn active" onclick="setFilter('all')">全 部</button>
        <button class="c-filter-btn" onclick="setFilter('Fusion')">热熔</button>
        <button class="c-filter-btn" onclick="setFilter('Glacio')">冷凝</button>
        <button class="c-filter-btn" onclick="setFilter('Electro')">导电</button>
        <button class="c-filter-btn" onclick="setFilter('Aero')">气动</button>
        <button class="c-filter-btn" onclick="setFilter('Spectro')">衍射</button>
        <button class="c-filter-btn" onclick="setFilter('Havoc')">湮灭</button>
        <button class="c-filter-btn" onclick="setGenFilter(1)">1代C</button>
        <button class="c-filter-btn" onclick="setGenFilter(2)">2代C</button>
        <button class="c-filter-btn" onclick="setGenFilter(3)">3代C</button>
        <button class="c-filter-btn" onclick="setFilter('fourStar')">4星专属</button>
        <input class="char-search-input" id="search-input" placeholder="搜索角色..." oninput="renderGrid()">
      </div>
      <div class="char-grid-area" id="char-grid"></div>
    </div>

  </div>

  <!-- 全息战略控制栏 -->
  <div id="holo-ctrl-panel">
    <div class="sec-title">全息战略 · 挑战怪物配置与积分</div>
    <div class="holo-enemy-inputs" id="holo-inputs"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
      <div><span style="font-size:11px;color:var(--text-muted);">当前积分:</span> <span id="holo-score-display" style="font-family:var(--font-title);font-size:18px;font-weight:700;color:var(--gold-hex);">0</span></div>
      <div style="display:flex;gap:6px;">
        <button class="dur-btn" onclick="saveHolo()">保存怪物</button>
        <button class="dur-btn t-active" onclick="defeatEnemy()">击败怪物 +1</button>
        <button class="dur-btn" style="color:var(--red-team);border-color:var(--red-team);" onclick="challengerDied()">角色阵亡 清零</button>
        <button class="dur-btn" onclick="resetHolo()">重置挑战</button>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
const SEQ_BAN_PICK = [
  { phase: 'ban', player: 1 }, { phase: 'ban', player: 2 },
  { phase: 'ban', player: 1 }, { phase: 'ban', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 1 },
  { phase: 'ban', player: 2 }, { phase: 'ban', player: 1 },
  { phase: 'ban', player: 2 }, { phase: 'ban', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 }
];

const SEQ_PICK_ONLY = [
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 }
];

let SEQ = SEQ_BAN_PICK;

let S = {
  step: 0, p1bans: [], p2bans: [], p1picks: [], p2picks: [],
  selected: null, done: false, scoreP1: 0, scoreP2: 0,
  p1name: '玩家一', p2name: '玩家二',
  p1sub: '旧雨杯参赛选手', p2sub: '旧雨杯参赛选手',
  holoEnemies: ['飞廉之猩','燎照之骑','无冠者','芙露德莉斯','赫卡忒','罗蕾莱'],
  holoCurrentEnemy: 0, holoScore: 0,
  mode: 'ban_pick',
  timerStart: null, timerDuration: 60
};

let currentFilter = 'all';
let currentGen = null;

// MQTT 同步推送
let mqttClient = null;
(function(){
  const ch = window.SYNC_CHANNEL;
  if(!ch || ch.includes('填入')) return;
  try {
    mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'wuwa_ctrl_' + (Math.random()*1e9|0).toString(36),
      reconnectPeriod: 3000, clean: true
    });
    mqttClient.on('connect', () => {
      document.getElementById('sync-status').textContent = '● 远程同步已连接 · ' + ch;
    });
  } catch(e){}
})();

function saveState(){
  const out = { ...S };
  delete out.selected;
  localStorage.setItem('wuwa_bp_state', JSON.stringify(out));
  if(mqttClient && mqttClient.connected){
    mqttClient.publish(window.SYNC_CHANNEL, JSON.stringify(out), { qos: 0, retain: true });
  }
}

function loadState(){
  try {
    const raw = localStorage.getItem('wuwa_bp_state');
    if(raw) S = Object.assign(S, JSON.parse(raw));
  } catch(e){}
}

function isCharUsed(name){
  const used = [...(S.p1bans||[]), ...(S.p2bans||[]), ...(S.p1picks||[]), ...(S.p2picks||[])];
  return used.some(c => c && c.name === name);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function setMode(mode){
  if(S.mode === mode) return;
  S.mode = mode;
  SEQ = mode === 'pick_only' ? SEQ_PICK_ONLY : SEQ_BAN_PICK;
  document.getElementById('btn-mode-bp').classList.toggle('m-active', mode === 'ban_pick');
  document.getElementById('btn-mode-pick').classList.toggle('m-active', mode === 'pick_only');
  document.getElementById('mode-badge').textContent = mode === 'pick_only' ? '24进16 · 仅选角色' : '16强 · BAN/PICK';
  resetBP();
  showToast(mode === 'pick_only' ? '已切换至 24进16 仅选角色' : '已切换至 16强 BAN/PICK');
}

function syncNames(){
  S.p1name = document.getElementById('p1-name-in').value || '玩家一';
  S.p2name = document.getElementById('p2-name-in').value || '玩家二';
  S.p1sub = document.getElementById('p1-sub-in').value || '';
  S.p2sub = document.getElementById('p2-sub-in').value || '';
  saveState();
}

function setTimerDur(dur){
  S.timerDuration = dur;
  document.querySelectorAll('.dur-btn').forEach(b => {
    b.classList.toggle('t-active', parseInt(b.getAttribute('data-dur')) === dur);
  });
  if(!S.done){
    S.timerStart = Date.now();
    saveState();
  }
}

function selectChar(name){
  if(isCharUsed(name)) return;
  const char = window.getCharInfo ? window.getCharInfo(name) : { name, img: './images/jx.jpg' };
  S.selected = char;
  document.getElementById('action-selected').textContent = char.name + ' (' + (char.en||'') + ')';
  document.getElementById('confirm-btn').disabled = false;
  renderGrid();
}

function confirmAction(){
  if(!S.selected || S.done || S.step >= SEQ.length) return;
  const cur = SEQ[S.step];
  const arrKey = cur.player === 1 ? (cur.phase === 'ban' ? 'p1bans' : 'p1picks') : (cur.phase === 'ban' ? 'p2bans' : 'p2picks');
  if(!S[arrKey]) S[arrKey] = [];
  S[arrKey].push(S.selected);

  if(!S.bpTimeline) S.bpTimeline = [];
  S.bpTimeline.push({ step: S.step, player: cur.player, phase: cur.phase, char: S.selected });

  S.step++;
  if(S.step >= SEQ.length) S.done = true;
  S.selected = null;
  S.timerStart = Date.now();

  document.getElementById('confirm-btn').disabled = true;
  document.getElementById('action-selected').textContent = '— 请在右侧选择角色 —';

  saveState();
  renderAll();
}

function randomPick(){
  const avail = (window.ALL_CHARACTERS || []).filter(c => !isCharUsed(c.name));
  if(avail.length === 0) return;
  const rand = avail[Math.floor(Math.random() * avail.length)];
  selectChar(rand.name);
  confirmAction();
}

function skipAction(){
  if(S.done || S.step >= SEQ.length) return;
  S.step++;
  if(S.step >= SEQ.length) S.done = true;
  S.selected = null;
  S.timerStart = Date.now();
  saveState();
  renderAll();
}

function resetBP(){
  S.step = 0; S.p1bans = []; S.p2bans = []; S.p1picks = []; S.p2picks = [];
  S.selected = null; S.done = false; S.bpTimeline = [];
  S.timerStart = Date.now();
  document.getElementById('confirm-btn').disabled = true;
  document.getElementById('action-selected').textContent = '— 请在右侧选择角色 —';
  saveState();
  renderAll();
  showToast('BP 已重置');
}

function adjScore(player, delta){
  if(player === 1) S.scoreP1 = Math.max(0, (S.scoreP1 || 0) + delta);
  else S.scoreP2 = Math.max(0, (S.scoreP2 || 0) + delta);
  document.getElementById('sc1').textContent = S.scoreP1;
  document.getElementById('sc2').textContent = S.scoreP2;
  saveState();
}

function setFilter(el){
  currentFilter = el; currentGen = null;
  document.querySelectorAll('.c-filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid();
}

function setGenFilter(gen){
  currentFilter = 'all'; currentGen = gen;
  document.querySelectorAll('.c-filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid();
}

function renderGrid(){
  const search = (document.getElementById('search-input').value || '').trim();
  const list = (window.ALL_CHARACTERS || []).filter(c => {
    if(search && !c.name.includes(search) && !c.en.toLowerCase().includes(search.toLowerCase())) return false;
    if(currentGen && c.gen !== currentGen) return false;
    if(currentFilter === 'fourStar' && c.role !== 'fourStar' && c.star !== 4) return false;
    if(currentFilter !== 'all' && currentFilter !== 'fourStar' && c.el !== currentFilter) return false;
    return true;
  });

  let h = '';
  list.forEach(c => {
    const disabled = isCharUsed(c.name);
    const selected = S.selected && S.selected.name === c.name;
    h += `<div class="c-card ${disabled ? 'disabled' : ''} ${selected ? 'selected' : ''}" onclick="selectChar('${c.name}')">
      <img src="${c.img}" alt="${c.name}">
      <div class="c-card-name">${c.name}</div>
    </div>`;
  });
  document.getElementById('char-grid').innerHTML = h;
}

function renderSeqList(){
  let h = '';
  SEQ.forEach((s, i) => {
    const isCur = i === S.step && !S.done;
    const isDone = i < S.step;
    h += `<div class="seq-row-item ${isCur ? 'cur' : ''} ${isDone ? 'done' : ''}">
      <span>#${i+1} 玩家${s.player} · ${s.phase === 'ban' ? '禁用' : '选择'}</span>
      <span style="color:${s.player === 1 ? 'var(--blue-team)' : 'var(--red-team)'}">${s.player === 1 ? 'BLUE' : 'RED'}</span>
    </div>`;
  });
  document.getElementById('seq-list').innerHTML = h;
}

function renderHoloInputs(){
  const en = S.holoEnemies || ['飞廉之猩','燎照之骑','无冠者','芙露德莉斯','赫卡忒','罗蕾莱'];
  let h = '';
  en.forEach((name, i) => {
    h += `<input class="holo-in-box" value="${name}" id="holo-enemy-${i}" placeholder="Boss ${i+1}">`;
  });
  document.getElementById('holo-inputs').innerHTML = h;
  document.getElementById('holo-score-display').textContent = S.holoScore || 0;
}

function saveHolo(){
  S.holoEnemies = [];
  for(let i=0; i<6; i++){
    const val = document.getElementById('holo-enemy-'+i).value || ('Boss '+(i+1));
    S.holoEnemies.push(val);
  }
  saveState();
  showToast('全息怪物配置已保存');
}

function defeatEnemy(){
  S.holoCurrentEnemy = Math.min(6, (S.holoCurrentEnemy || 0) + 1);
  S.holoScore = (S.holoScore || 0) + 1;
  document.getElementById('holo-score-display').textContent = S.holoScore;
  saveState();
}

function challengerDied(){
  S.holoScore = 0;
  S.holoCurrentEnemy = 0;
  document.getElementById('holo-score-display').textContent = 0;
  saveState();
  showToast('角色阵亡，积分已清零');
}

function resetHolo(){
  S.holoScore = 0;
  S.holoCurrentEnemy = 0;
  document.getElementById('holo-score-display').textContent = 0;
  saveState();
}

function renderAll(){
  document.getElementById('p1-name-in').value = S.p1name || '玩家一';
  document.getElementById('p2-name-in').value = S.p2name || '玩家二';
  document.getElementById('p1-sub-in').value = S.p1sub || '旧雨杯参赛选手';
  document.getElementById('p2-sub-in').value = S.p2sub || '旧雨杯参赛选手';
  document.getElementById('sc1').textContent = S.scoreP1 || 0;
  document.getElementById('sc2').textContent = S.scoreP2 || 0;

  if(!S.done && S.step < SEQ.length){
    const cur = SEQ[S.step];
    document.getElementById('action-label').textContent = `玩家${cur.player} · ${cur.phase === 'ban' ? '禁用阶段' : '选择阶段'}`;
    document.getElementById('action-label').style.color = cur.player === 1 ? 'var(--blue-team)' : 'var(--red-team)';
  } else {
    document.getElementById('action-label').textContent = 'BP 已全部完成';
    document.getElementById('action-label').style.color = 'var(--gold-hex)';
  }

  renderSeqList();
  renderGrid();
  renderHoloInputs();
}

document.addEventListener('keydown', e => {
  if(e.key === 'Enter') confirmAction();
});

loadState();
renderAll();
</script>
</body>
</html>
