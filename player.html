<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旧雨杯 · 选手选角客户端</title>
<link rel="stylesheet" href="./theme-wuwa-deep.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Rajdhani:wght@600;700&family=Oswald:wght@500;600;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue-team: #00d2ff;
  --blue-glow: rgba(0, 210, 255, 0.65);
  --red-team: #ff3366;
  --red-glow: rgba(255, 51, 102, 0.65);
  --ban-red: #ff2233;
  --gold-hex: #e5b960;
  --gold-glow: rgba(229, 185, 96, 0.55);
  --teal: #20e8a0;

  --bg: #030712;
  --panel: rgba(6, 14, 32, 0.94);
  --panel-border: rgba(56, 189, 248, 0.22);
  --text-main: #f0f6fc;
  --text-muted: #7390b0;

  --font-esports: 'Rajdhani', 'Oswald', 'Noto Sans SC', sans-serif;
  --font-title: 'Oswald', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', sans-serif;
}

html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text-main);
  font-family: var(--font-body);
  user-select: none;
}

body::before {
  content: ''; position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 800px 500px at 50% 0%, rgba(0, 160, 255, 0.1) 0%, transparent 60%),
    linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
  background-size: 100% 100%, 36px 36px, 36px 36px;
  pointer-events: none;
}

/* ════════ 身份选择界面 ════════ */
#player-select-view {
  position: fixed; inset: 0; z-index: 999;
  background: linear-gradient(165deg, rgba(2, 6, 18, 0.98) 0%, rgba(4, 10, 28, 0.99) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
}
.ps-main-title {
  font-family: var(--font-title); font-size: 32px; font-weight: 700; letter-spacing: 8px;
  background: linear-gradient(180deg, #fff 0%, #a4c2e6 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.ps-sub-title { font-family: var(--font-esports); font-size: 13px; letter-spacing: 4px; color: var(--text-muted); }

.ps-button-group { display: flex; gap: 24px; margin-top: 12px; }
.ps-choice-btn {
  padding: 18px 48px; border-radius: 6px; cursor: pointer;
  font-family: var(--font-title); font-size: 18px; font-weight: 700; letter-spacing: 3px;
  border: 2px solid; transition: all 0.25s ease;
}
.ps-choice-btn.p1 {
  background: rgba(0, 210, 255, 0.12); border-color: var(--blue-team); color: var(--blue-team);
}
.ps-choice-btn.p1:hover {
  background: var(--blue-team); color: #000; box-shadow: 0 0 30px var(--blue-glow);
}
.ps-choice-btn.p2 {
  background: rgba(255, 51, 102, 0.12); border-color: var(--red-team); color: var(--red-team);
}
.ps-choice-btn.p2:hover {
  background: var(--red-team); color: #fff; box-shadow: 0 0 30px var(--red-glow);
}

/* ════════ 选角主界面 ════════ */
#player-app {
  position: relative; z-index: 10;
  max-width: 1080px; margin: 0 auto; padding: 16px 20px;
  display: flex; flex-direction: column; gap: 12px;
}

/* 顶部信息栏 */
#player-header {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 10px 18px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
}
.ph-identity { display: flex; align-items: center; gap: 12px; }
.ph-tag { font-family: var(--font-title); font-size: 16px; font-weight: 700; letter-spacing: 2px; }
.ph-state-badge {
  font-family: var(--font-esports); font-size: 11px; font-weight: 700; letter-spacing: 2px;
  padding: 3px 12px; border-radius: 3px;
}
.ph-state-badge.your-turn { background: rgba(32, 232, 160, 0.15); border: 1px solid var(--teal); color: var(--teal); animation: badge-pulse 1.2s infinite; }
.ph-state-badge.wait { background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); color: var(--text-muted); }
.ph-state-badge.done { background: rgba(229, 185, 96, 0.15); border: 1px solid var(--gold-hex); color: var(--gold-hex); }

@keyframes badge-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.ph-timer-display {
  font-family: 'Oswald', var(--font-esports); font-size: 32px; font-weight: 700;
  color: var(--blue-team); text-shadow: 0 0 16px var(--blue-glow); min-width: 60px; text-align: right;
}

/* 选手操作栏 (Action Bar) */
#player-action-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 12px 18px;
}
.pab-phase-title { font-family: var(--font-title); font-size: 16px; font-weight: 700; letter-spacing: 2px; }
.pab-phase-desc { font-size: 11px; color: var(--text-muted); letter-spacing: 1px; margin-top: 2px; }

.pab-right-ctrl { display: flex; align-items: center; gap: 14px; }
.pab-selected-name {
  font-family: var(--font-title); font-size: 18px; font-weight: 700; letter-spacing: 2px;
  color: var(--gold-hex); text-shadow: 0 0 12px var(--gold-glow);
}
.pab-lock-btn {
  padding: 10px 32px; border-radius: 4px; cursor: pointer;
  font-family: var(--font-title); font-size: 14px; font-weight: 700; letter-spacing: 3px;
  border: 1px solid var(--blue-team); background: rgba(0, 210, 255, 0.2); color: var(--blue-team);
  transition: all 0.2s;
}
.pab-lock-btn:hover:not(:disabled) { background: var(--blue-team); color: #000; box-shadow: 0 0 20px var(--blue-glow); }
.pab-lock-btn:disabled { opacity: 0.25; cursor: not-allowed; border-color: rgba(255, 255, 255, 0.15); color: var(--text-muted); }

/* 双方实时阵容迷你概览 (Roster Mini Bar) */
#roster-overview {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.roster-side-card {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 10px 14px; display: flex; flex-direction: column; gap: 6px;
}
.roster-side-title { font-family: var(--font-esports); font-size: 11px; font-weight: 700; letter-spacing: 2px; }
.roster-mini-row { display: flex; gap: 6px; flex-wrap: wrap; }
.roster-mini-avatar {
  width: 32px; height: 32px; border-radius: 3px; overflow: hidden; position: relative;
  background: rgba(4, 10, 24, 0.8); border: 1px solid rgba(56, 189, 248, 0.25);
}
.roster-mini-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; }
.roster-mini-avatar.ban-x::after {
  content: '✕'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(200, 20, 20, 0.65); color: #fff; font-size: 14px; font-weight: 900;
}

/* 角色筛选与网格 */
#char-select-section {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.cs-filter-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cs-filter-btn {
  font-family: var(--font-esports); font-size: 11px; font-weight: 700; letter-spacing: 1px;
  padding: 4px 12px; border-radius: 3px; cursor: pointer;
  background: rgba(14, 28, 56, 0.6); color: var(--text-muted); border: 1px solid rgba(56, 189, 248, 0.2);
  transition: all 0.15s;
}
.cs-filter-btn.active, .cs-filter-btn:hover { background: var(--blue-team); color: #000; border-color: var(--blue-team); }

.cs-search-input {
  background: rgba(4, 10, 24, 0.85); border: 1px solid var(--panel-border); border-radius: 4px;
  color: #fff; font-size: 12px; padding: 6px 14px; outline: none; margin-left: auto; width: 200px;
}

.cs-cards-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px;
  max-height: 460px; overflow-y: auto; padding-right: 4px;
}

.cs-hero-card {
  height: 125px; border-radius: 4px; position: relative; overflow: hidden;
  background: rgba(4, 10, 24, 0.85); border: 1px solid rgba(56, 189, 248, 0.2);
  cursor: pointer; transition: all 0.2s;
}
.cs-hero-card:hover { border-color: var(--blue-team); transform: translateY(-2px); box-shadow: 0 4px 16px var(--blue-glow); }
.cs-hero-card.selected { border: 2px solid var(--gold-hex); box-shadow: 0 0 20px var(--gold-glow); }
.cs-hero-card.disabled { filter: grayscale(1); opacity: 0.22; cursor: not-allowed; pointer-events: none; }

.cs-hero-card img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; }
.cs-hero-name {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 3px 4px;
  background: linear-gradient(0deg, rgba(2, 6, 18, 0.98), transparent);
  font-size: 11px; font-weight: 700; text-align: center; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 8px 24px; border-radius: 4px; background: rgba(0, 210, 255, 0.95);
  color: #000; font-family: var(--font-title); font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999;
}
#toast.show { opacity: 1; }

</style>
<script src="./characters-data.js"></script>
<script src="./mqtt.min.js"></script>
<script src="./sync-config.js"></script>
</head>
<body>

<!-- 选手身份选择弹窗 -->
<div id="player-select-view">
  <div class="ps-main-title">旧 雨 杯 · 选 手 端</div>
  <div class="ps-sub-title">SELECT YOUR PLAYER IDENTITY</div>
  <div class="ps-button-group">
    <button class="ps-choice-btn p1" onclick="choosePlayer(1)">◈ 选手一 · BLUE P1</button>
    <button class="ps-choice-btn p2" onclick="choosePlayer(2)">◈ 选手二 · RED P2</button>
  </div>
</div>

<!-- 选角主界面 -->
<div id="player-app" style="display:none;">

  <!-- 顶部状态栏 -->
  <div id="player-header">
    <div class="ph-identity">
      <div class="ph-tag" id="ph-player-title">选手一 · BLUE P1</div>
      <div class="ph-state-badge wait" id="ph-turn-badge">等待中</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="font-size:11px;font-weight:700;color:var(--teal);" id="sync-dot">● 已同步</div>
      <div class="ph-timer-display" id="ph-timer-num">—</div>
    </div>
  </div>

  <!-- 操作与锁定栏 -->
  <div id="player-action-bar">
    <div>
      <div class="pab-phase-title" id="pab-phase-name">正在等待 BP 开始...</div>
      <div class="pab-phase-desc" id="pab-phase-hint">请观察对方与己方阵容，挑选适合的出战角色</div>
    </div>
    <div class="pab-right-ctrl">
      <div class="pab-selected-name" id="pab-selected-text">— 未选择 —</div>
      <button class="pab-lock-btn" id="lock-btn" onclick="confirmLock()" disabled>锁 定 角 色</button>
    </div>
  </div>

  <!-- 双方阵容概览 -->
  <div id="roster-overview">
    <div class="roster-side-card">
      <div class="roster-side-title" style="color:var(--blue-team);" id="rst-p1-name">蓝方 P1 阵容</div>
      <div style="font-size:9px;color:var(--text-muted);margin-top:2px;">禁用:</div>
      <div class="roster-mini-row" id="rst-p1-bans"></div>
      <div style="font-size:9px;color:var(--text-muted);margin-top:2px;">选择:</div>
      <div class="roster-mini-row" id="rst-p1-picks"></div>
    </div>
    <div class="roster-side-card">
      <div class="roster-side-title" style="color:var(--red-team);text-align:right;" id="rst-p2-name">红方 P2 阵容</div>
      <div style="font-size:9px;color:var(--text-muted);text-align:right;margin-top:2px;">禁用:</div>
      <div class="roster-mini-row" style="justify-content:flex-end;" id="rst-p2-bans"></div>
      <div style="font-size:9px;color:var(--text-muted);text-align:right;margin-top:2px;">选择:</div>
      <div class="roster-mini-row" style="justify-content:flex-end;" id="rst-p2-picks"></div>
    </div>
  </div>

  <!-- 角色选择区 -->
  <div id="char-select-section">
    <div class="cs-filter-bar">
      <button class="cs-filter-btn active" onclick="setFilter('all')">全 部</button>
      <button class="cs-filter-btn" onclick="setFilter('Fusion')">热熔</button>
      <button class="cs-filter-btn" onclick="setFilter('Glacio')">冷凝</button>
      <button class="cs-filter-btn" onclick="setFilter('Electro')">导电</button>
      <button class="cs-filter-btn" onclick="setFilter('Aero')">气动</button>
      <button class="cs-filter-btn" onclick="setFilter('Spectro')">衍射</button>
      <button class="cs-filter-btn" onclick="setFilter('Havoc')">湮灭</button>
      <button class="cs-filter-btn" onclick="setGenFilter(1)">1代C</button>
      <button class="cs-filter-btn" onclick="setGenFilter(2)">2代C</button>
      <button class="cs-filter-btn" onclick="setGenFilter(3)">3代C</button>
      <button class="cs-filter-btn" onclick="setFilter('fourStar')">4星专属</button>
      <input class="cs-search-input" id="search-input" placeholder="搜索英雄..." oninput="renderGrid()">
    </div>
    <div class="cs-cards-grid" id="char-grid"></div>
  </div>

</div>

<div id="toast"></div>

<script>
let myPlayer = null; // 1 or 2
let selectedHero = null;
let currentFilter = 'all';
let currentGen = null;

const SEQ_BAN_PICK = [
  { phase: 'ban', player: 1 }, { phase: 'ban', player: 2 },
  { phase: 'ban', player: 1 }, { phase: 'ban', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 1 },
  { phase: 'ban', player: 2 }, { phase: 'ban', player: 1 },
  { phase: 'ban', player: 2 }, { phase: 'ban', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 }
];

const SEQ_PICK_ONLY = [
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 },
  { phase: 'pick', player: 1 }, { phase: 'pick', player: 2 },
  { phase: 'pick', player: 2 }, { phase: 'pick', player: 1 }
];

let S = {
  step: 0, p1bans: [], p2bans: [], p1picks: [], p2picks: [],
  done: false, p1name: '玩家一', p2name: '玩家二',
  mode: 'ban_pick', timerStart: null, timerDuration: 60
};

// 远程 MQTT 同步
let mqttClient = null;
(function(){
  const ch = window.SYNC_CHANNEL;
  if(!ch || ch.includes('填入')) return;
  try {
    mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'wuwa_player_' + (Math.random()*1e9|0).toString(36),
      reconnectPeriod: 3000, clean: true
    });
    mqttClient.on('connect', () => {
      mqttClient.subscribe(ch);
      document.getElementById('sync-dot').textContent = '● 已同步 · ' + ch;
    });
    mqttClient.on('message', (t, msg) => {
      const j = msg.toString();
      if(j !== localStorage.getItem('wuwa_bp_state')){
        localStorage.setItem('wuwa_bp_state', j);
        loadState();
        renderAll();
      }
    });
  } catch(e){}
})();

function loadState(){
  try {
    const raw = localStorage.getItem('wuwa_bp_state');
    if(raw) S = Object.assign(S, JSON.parse(raw));
  } catch(e){}
}

function saveState(){
  localStorage.setItem('wuwa_bp_state', JSON.stringify(S));
  if(mqttClient && mqttClient.connected){
    mqttClient.publish(window.SYNC_CHANNEL, JSON.stringify(S), { qos: 0, retain: true });
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function choosePlayer(p){
  myPlayer = p;
  document.getElementById('player-select-view').style.display = 'none';
  document.getElementById('player-app').style.display = 'flex';
  const isP1 = p === 1;
  document.getElementById('ph-player-title').textContent = isP1 ? '选手一 · BLUE P1' : '选手二 · RED P2';
  document.getElementById('ph-player-title').style.color = isP1 ? 'var(--blue-team)' : 'var(--red-team)';
  loadState();
  renderAll();
}

function isCharUsed(name){
  const used = [...(S.p1bans||[]), ...(S.p2bans||[]), ...(S.p1picks||[]), ...(S.p2picks||[])];
  return used.some(c => c && c.name === name);
}

function selectHero(name){
  if(isCharUsed(name)) return;
  const seq = S.mode === 'pick_only' ? SEQ_PICK_ONLY : SEQ_BAN_PICK;
  const isMyTurn = !S.done && S.step < seq.length && seq[S.step].player === myPlayer;
  if(!isMyTurn) return;

  const char = window.getCharInfo ? window.getCharInfo(name) : { name, img: './images/jx.jpg' };
  selectedHero = char;
  document.getElementById('pab-selected-text').textContent = char.name;
  document.getElementById('lock-btn').disabled = false;
  renderGrid();
}

function confirmLock(){
  if(!selectedHero) return;
  const seq = S.mode === 'pick_only' ? SEQ_PICK_ONLY : SEQ_BAN_PICK;
  const isMyTurn = !S.done && S.step < seq.length && seq[S.step].player === myPlayer;
  if(!isMyTurn) return;

  const cur = seq[S.step];
  const arrKey = cur.player === 1 ? (cur.phase === 'ban' ? 'p1bans' : 'p1picks') : (cur.phase === 'ban' ? 'p2bans' : 'p2picks');
  if(!S[arrKey]) S[arrKey] = [];
  S[arrKey].push(selectedHero);

  S.step++;
  if(S.step >= seq.length) S.done = true;
  S.timerStart = Date.now();
  selectedHero = null;

  document.getElementById('lock-btn').disabled = true;
  document.getElementById('pab-selected-text').textContent = '— 未选择 —';

  saveState();
  renderAll();
  showToast('已锁定: ' + (S[arrKey][S[arrKey].length - 1].name));
}

function setFilter(el){
  currentFilter = el; currentGen = null;
  document.querySelectorAll('.cs-filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid();
}

function setGenFilter(gen){
  currentFilter = 'all'; currentGen = gen;
  document.querySelectorAll('.cs-filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid();
}

function renderGrid(){
  const search = (document.getElementById('search-input').value || '').trim();
  const list = (window.ALL_CHARACTERS || []).filter(c => {
    if(search && !c.name.includes(search) && !c.en.toLowerCase().includes(search.toLowerCase())) return false;
    if(currentGen && c.gen !== currentGen) return false;
    if(currentFilter === 'fourStar' && c.role !== 'fourStar' && c.star !== 4) return false;
    if(currentFilter !== 'all' && currentFilter !== 'fourStar' && c.el !== currentFilter) return false;
    return true;
  });

  let h = '';
  list.forEach(c => {
    const disabled = isCharUsed(c.name);
    const selected = selectedHero && selectedHero.name === c.name;
    h += `<div class="cs-hero-card ${disabled ? 'disabled' : ''} ${selected ? 'selected' : ''}" onclick="selectHero('${c.name}')">
      <img src="${c.img}" alt="${c.name}">
      <div class="cs-hero-name">${c.name}</div>
    </div>`;
  });
  document.getElementById('char-grid').innerHTML = h;
}

function renderRosters(){
  document.getElementById('rst-p1-name').textContent = (S.p1name || '玩家一') + ' · BLUE';
  document.getElementById('rst-p2-name').textContent = (S.p2name || '玩家二') + ' · RED';

  let p1b = '', p1p = '', p2b = '', p2p = '';
  (S.p1bans || []).forEach(c => {
    if(c) p1b += `<div class="roster-mini-avatar ban-x"><img src="${c.img}"></div>`;
  });
  (S.p1picks || []).forEach(c => {
    if(c) p1p += `<div class="roster-mini-avatar"><img src="${c.img}"></div>`;
  });
  (S.p2bans || []).forEach(c => {
    if(c) p2b += `<div class="roster-mini-avatar ban-x"><img src="${c.img}"></div>`;
  });
  (S.p2picks || []).forEach(c => {
    if(c) p2p += `<div class="roster-mini-avatar"><img src="${c.img}"></div>`;
  });

  document.getElementById('rst-p1-bans').innerHTML = p1b || '<span style="font-size:10px;color:rgba(255,255,255,0.2);">无</span>';
  document.getElementById('rst-p1-picks').innerHTML = p1p || '<span style="font-size:10px;color:rgba(255,255,255,0.2);">暂无</span>';
  document.getElementById('rst-p2-bans').innerHTML = p2b || '<span style="font-size:10px;color:rgba(255,255,255,0.2);">无</span>';
  document.getElementById('rst-p2-picks').innerHTML = p2p || '<span style="font-size:10px;color:rgba(255,255,255,0.2);">暂无</span>';
}

function renderAll(){
  const seq = S.mode === 'pick_only' ? SEQ_PICK_ONLY : SEQ_BAN_PICK;
  const isDone = S.done || S.step >= seq.length;
  const isMyTurn = !isDone && seq[S.step].player === myPlayer;

  const badge = document.getElementById('ph-turn-badge');
  if(isDone){
    badge.textContent = 'BP 完成'; badge.className = 'ph-state-badge done';
    document.getElementById('pab-phase-name').textContent = 'BP 环节已全部结束';
    document.getElementById('pab-phase-hint').textContent = '请准备进入游戏对局';
  } else if(isMyTurn){
    const cur = seq[S.step];
    badge.textContent = '你的回合 · ' + (cur.phase === 'ban' ? '禁用' : '选择');
    badge.className = 'ph-state-badge your-turn';
    document.getElementById('pab-phase-name').textContent = '正在轮到你进行 · ' + (cur.phase === 'ban' ? '【禁用】' : '【选择】');
    document.getElementById('pab-phase-hint').textContent = '请在下方列表点击心仪的角色，然后点击右侧「锁定角色」';
  } else {
    const cur = seq[S.step];
    badge.textContent = '等待对方操作...';
    badge.className = 'ph-state-badge wait';
    document.getElementById('pab-phase-name').textContent = '正在轮到 玩家' + cur.player + ' 进行 ' + (cur.phase === 'ban' ? '【禁用】' : '【选择】');
    document.getElementById('pab-phase-hint').textContent = '请稍候，对方正在思考选择中';
  }

  // 倒计时计算
  if(S.timerStart && S.timerDuration > 0 && !isDone){
    const rem = Math.max(0, Math.ceil(S.timerDuration - (Date.now() - S.timerStart)/1000));
    document.getElementById('ph-timer-num').textContent = rem + 's';
    document.getElementById('ph-timer-num').style.color = rem <= 10 ? '#ff3366' : 'var(--blue-team)';
  } else {
    document.getElementById('ph-timer-num').textContent = '∞';
  }

  renderRosters();
  renderGrid();
}

// 自动检测启动参数
(function(){
  const auto = localStorage.getItem('bp_autoPlayer');
  if(auto === '1' || auto === '2'){
    choosePlayer(parseInt(auto));
  }
})();

setInterval(() => {
  loadState();
  if(myPlayer) renderAll();
}, 500);

window.addEventListener('storage', () => {
  loadState();
  if(myPlayer) renderAll();
});
</script>
